<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Calculator.css">
    <script src="Calculator.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div id="result"></div>
    <table id="btns"> 
  <tr> 
    <td><button id="b" onclick="Display(this)" value="^">^</button></td> 
    <td><button id="b" onclick="clearscr()">AC</button></td> 
    <td><button id="b" onclick="oneby()">1/x</button></td> 
    <td><button id="b">x <sup>2</sup></button></td> 
    <td><button id="b" onclick="Display(this)" value="*">X</button></td> 
  </tr> 
  <tr> 
    <td><button id="b" onclick="Display(this);get(this)" value="7">7</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="8">8</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="9">9</button></td> 
    <td><button id="b" onclick="Display(this)" value="/">/</button></td> 
    <td><button id="b">x!</button></td> 
  </tr> 
  <tr> 
    <td><button id="b" onclick="Display(this);get(this)" value="4">4</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="5">5</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="6">6</button></td> 
    <td><button id="b" onclick="Display(this)" value="-">-</button></td> 
    <td><button id="b" onclick="cubrt()">cubrt</button></td> 
  </tr> 
  <tr> 
    <td><button id="b" onclick="Display(this);get(this)" value="1">1</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="2">2</button></td> 
    <td><button id="b" onclick="Display(this);get(this)" value="3">3</button></td> 
    <td><button id="b" onclick="Display(this)" value="+">+</button></td> 
    <td><button id="b" onclick="Display(this)" value="()">()</button></td> 
  </tr> 
  <tr> 
    <td><button id="b" onclick="Display(this);get(this)" value="0">0</button></td> 
    <td><button id="b" onclick="Display(this)" value="-">-</button></td> 
    <td><button id="b" onclick="Display(this)" value=".">.</button></td> 
    <td><button id="b" onclick="sqrt()">sqrt</button></td> 
    <td><button id="b" onclick="equals()">=</button></td> 
  </tr> 
</table>
    </div>
</body>
</html>
